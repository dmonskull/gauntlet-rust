[workspace]
resolver = "3"
members = ["crates/gdl-formats", "crates/gdl-install", "crates/gdl-game", "crates/gdl-net"]

[workspace.package]
repository = "https://github.com/dmonskull/gauntlet-rust"
license = "MIT"
version = "0.2.3"
edition = "2024"
publish = false

[workspace.dependencies]
gdl-formats = { path = "crates/gdl-formats" }
gdl-install = { path = "crates/gdl-install" }
gdl-net = { path = "crates/gdl-net" }
bevy = { version = "0.18.1", features = ["libm"] }
libm = "0.2"
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Parses every level and decodes every texture at boot; keep that fast in
# debug builds too.
[profile.dev.package.gdl-formats]
opt-level = 3

[profile.release]
debug = 1
strip = false
