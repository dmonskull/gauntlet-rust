# Builds the game for Windows, macOS (Apple Silicon and Intel) and Linux and
# uploads each as a zip with PLAYING.md (no game data: players bring their
# own disc). Run it from the Actions tab, or push a tag like v0.1.0.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x86_64, exe: gdl-game.exe }
          - { os: macos-latest, name: macos-arm64, exe: gdl-game }
          - { os: macos-13, name: macos-x86_64, exe: gdl-game }
          - { os: ubuntu-latest, name: linux-x86_64, exe: gdl-game }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gdl-game
      - name: Pack
        shell: bash
        run: |
          mkdir -p gauntlet-dark-legacy-${{ matrix.name }}
          cp target/release/${{ matrix.exe }} PLAYING.md gauntlet-dark-legacy-${{ matrix.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-dark-legacy-${{ matrix.name }}
          path: gauntlet-dark-legacy-${{ matrix.name }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gauntlet-dark-legacy-${{ matrix.name }}/*
