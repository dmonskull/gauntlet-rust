# Builds the game for Windows, macOS (one universal build for Apple Silicon
# and Intel) and Linux, each as a zip with PLAYING.md and the licence (no
# game data: players bring their own disc). Pushing a tag like v0.1.0 also
# publishes the zips as that release's downloads; "Run workflow" on the
# Actions tab builds them without a release.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-universal }
          - { os: ubuntu-latest, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      PKG: gauntlet-dark-legacy-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build (macOS, both chips in one binary)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p gdl-game --target aarch64-apple-darwin
          cargo build --release -p gdl-game --target x86_64-apple-darwin
          mkdir -p "$PKG"
          lipo -create -output "$PKG/gdl-game" \
            target/aarch64-apple-darwin/release/gdl-game target/x86_64-apple-darwin/release/gdl-game
      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release -p gdl-game
          mkdir -p "$PKG"
          if [[ "$RUNNER_OS" == Windows ]]; then cp target/release/gdl-game.exe "$PKG/"; else cp target/release/gdl-game "$PKG/"; fi
      - name: Pack
        shell: bash
        run: |
          cp PLAYING.md LICENSE "$PKG/"
          if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "$PKG.zip" "$PKG"; else zip -r "$PKG.zip" "$PKG"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}.zip
          generate_release_notes: true
