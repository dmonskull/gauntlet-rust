[package]
name = "gdl-game"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gdl-formats.workspace = true
gdl-install.workspace = true
gdl-net.workspace = true
bevy.workspace = true
rfd = "0.17.2"
ron = "0.12"
# The online invite code goes through the clipboard (text only).
arboard = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
# Online sync points go packed (`online.rs`); the version and features the
# image loader already builds.
flate2 = "1"

# The file picker on macOS needs the program to be a running application
# first (`bootstrap.rs`); the same versions rfd uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
